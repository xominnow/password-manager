<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="930" viewBox="0 0 1560 930" role="img" aria-labelledby="title desc">
  <title id="title">Password Manager Android GUI mockups</title>
  <desc id="desc">Six editable mobile interface mockups showing login, recovery, vault list, add credential, credential detail, and password generator screens.</desc>
  <style>
    .canvas { fill: #f4f7fb; }
    .phone { fill: #ffffff; stroke: #182230; stroke-width: 3; }
    .bar { fill: #17324d; }
    .accent { fill: #2f80ed; }
    .accent-light { fill: #e8f1ff; }
    .ink { fill: #182230; }
    .muted { fill: #687587; }
    .line { stroke: #d9e1eb; stroke-width: 2; }
    .success { fill: #1f9d67; }
    .warning { fill: #b26a00; }
    .card { fill: #f7f9fc; stroke: #d9e1eb; stroke-width: 2; }
    .label { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #182230; }
    .body { font-family: Arial, sans-serif; font-size: 14px; fill: #182230; }
    .small { font-family: Arial, sans-serif; font-size: 11px; fill: #687587; }
    .button { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .button-dark { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #17324d; text-anchor: middle; }
  </style>

  <rect class="canvas" width="1560" height="930"/>
  <text x="40" y="45" class="label" font-size="25">Password Manager — Android GUI Mockups</text>
  <text x="40" y="70" class="small">Phase-one concept • Python/Kivy implementation target • Editable SVG wireframes</text>

  <!-- Frame 1: Login -->
  <g transform="translate(40,105)">
    <rect class="phone" width="230" height="720" rx="28"/>
    <rect class="bar" width="230" height="78" rx="28"/>
    <rect class="bar" y="45" width="230" height="33"/>
    <text x="22" y="38" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Lockbox</text>
    <circle cx="198" cy="28" r="12" fill="#2f80ed"/>
    <path d="M194 29 l4 4 7-9" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="24" y="135" class="label" font-size="22">Welcome back</text>
    <text x="24" y="160" class="small">Unlock your local vault</text>
    <text x="24" y="214" class="label">Master password</text>
    <rect x="24" y="228" width="182" height="44" rx="8" fill="#fff" stroke="#9eabba" stroke-width="2"/>
    <text x="40" y="256" class="muted" font-size="20">••••••••••</text>
    <text x="184" y="256" class="small">show</text>
    <rect class="accent" x="24" y="300" width="182" height="46" rx="9"/>
    <text x="115" y="329" class="button">Unlock vault</text>
    <text x="115" y="392" class="button-dark">Forgot master password?</text>
    <line x1="24" y1="440" x2="206" y2="440" class="line"/>
    <text x="24" y="478" class="small">Offline by design. No account or network needed.</text>
    <text x="24" y="668" class="small">Secure screen enabled</text>
    <text x="24" y="688" class="small">Auto-lock: 2 minutes</text>
    <text x="115" y="754" class="small" text-anchor="middle">S-04 Login</text>
  </g>

  <!-- Frame 2: Recovery -->
  <g transform="translate(290,105)">
    <rect class="phone" width="230" height="720" rx="28"/>
    <rect class="bar" width="230" height="78" rx="28"/>
    <rect class="bar" y="45" width="230" height="33"/>
    <text x="22" y="38" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Recover access</text>
    <text x="24" y="132" class="label" font-size="20">Recovery key</text>
    <text x="24" y="158" class="small">Use the key saved during setup.</text>
    <rect x="24" y="190" width="182" height="90" rx="8" fill="#fff" stroke="#9eabba" stroke-width="2"/>
    <text x="38" y="222" class="body">ABCD-EFGH-IJKL-</text>
    <text x="38" y="248" class="body">MNOP-QRST-UVWX</text>
    <text x="24" y="312" class="small">The recovery key is never stored by the app.</text>
    <rect class="accent" x="24" y="350" width="182" height="46" rx="9"/>
    <text x="115" y="379" class="button">Verify key</text>
    <rect class="accent-light" x="24" y="420" width="182" height="94" rx="9"/>
    <text x="38" y="448" class="label">Important</text>
    <text x="38" y="472" class="small">If both credentials are lost,</text>
    <text x="38" y="490" class="small">the vault cannot be recovered.</text>
    <text x="24" y="668" class="small">Sensitive screen — screenshots blocked</text>
    <text x="115" y="754" class="small" text-anchor="middle">S-05 Recovery</text>
  </g>

  <!-- Frame 3: Vault list -->
  <g transform="translate(540,105)">
    <rect class="phone" width="230" height="720" rx="28"/>
    <rect class="bar" width="230" height="78" rx="28"/>
    <rect class="bar" y="45" width="230" height="33"/>
    <text x="22" y="38" fill="#fff" font-family="Arial" font-size="18" font-weight="700">My vault</text>
    <text x="196" y="38" fill="#fff" font-family="Arial" font-size="19" text-anchor="end">Lock</text>
    <rect x="20" y="100" width="190" height="40" rx="20" fill="#f0f3f7"/>
    <text x="38" y="126" class="muted">Search app or website</text>
    <circle cx="190" cy="120" r="8" fill="none" stroke="#687587" stroke-width="2"/>
    <line x1="196" y1="126" x2="202" y2="132" stroke="#687587" stroke-width="2"/>
    <rect class="card" x="20" y="166" width="190" height="72" rx="10"/>
    <circle cx="46" cy="202" r="18" class="accent"/>
    <text x="46" y="207" fill="#fff" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">G</text>
    <text x="76" y="198" class="label">Example App</text>
    <text x="76" y="219" class="small">demo-user</text>
    <rect class="card" x="20" y="252" width="190" height="72" rx="10"/>
    <circle cx="46" cy="288" r="18" fill="#1f9d67"/>
    <text x="46" y="293" fill="#fff" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">B</text>
    <text x="76" y="284" class="label">Bank Demo</text>
    <text x="76" y="305" class="small">test-account</text>
    <rect class="accent" x="20" y="610" width="190" height="48" rx="24"/>
    <text x="115" y="640" class="button">+ Add credential</text>
    <text x="20" y="690" class="small">2 entries • Encrypted locally</text>
    <text x="115" y="754" class="small" text-anchor="middle">S-07 Vault list</text>
  </g>

  <!-- Frame 4: Add credential -->
  <g transform="translate(790,105)">
    <rect class="phone" width="230" height="720" rx="28"/>
    <rect class="bar" width="230" height="78" rx="28"/>
    <rect class="bar" y="45" width="230" height="33"/>
    <text x="22" y="38" fill="#fff" font-family="Arial" font-size="18" font-weight="700">New credential</text>
    <text x="24" y="118" class="label">App or website</text>
    <rect x="24" y="130" width="182" height="40" rx="8" fill="#fff" stroke="#9eabba" stroke-width="2"/>
    <text x="38" y="156" class="muted">Example App</text>
    <text x="24" y="208" class="label">Username</text>
    <rect x="24" y="220" width="182" height="40" rx="8" fill="#fff" stroke="#9eabba" stroke-width="2"/>
    <text x="38" y="246" class="muted">demo-user</text>
    <text x="24" y="298" class="label">Password</text>
    <rect x="24" y="310" width="182" height="40" rx="8" fill="#fff" stroke="#9eabba" stroke-width="2"/>
    <text x="38" y="336" class="muted">••••••••••</text>
    <text x="190" y="336" class="small" text-anchor="end">show</text>
    <rect class="accent-light" x="24" y="370" width="182" height="44" rx="8"/>
    <text x="115" y="398" class="button-dark">Generate strong password</text>
    <text x="24" y="452" class="success" font-family="Arial" font-size="13" font-weight="700">Strong password</text>
    <rect x="24" y="468" width="182" height="8" rx="4" fill="#d9e1eb"/>
    <rect x="24" y="468" width="164" height="8" rx="4" class="success"/>
    <rect class="accent" x="24" y="530" width="182" height="46" rx="9"/>
    <text x="115" y="559" class="button">Save credential</text>
    <text x="115" y="754" class="small" text-anchor="middle">S-08 Add credential</text>
  </g>

  <!-- Frame 5: Detail -->
  <g transform="translate(1040,105)">
    <rect class="phone" width="230" height="720" rx="28"/>
    <rect class="bar" width="230" height="78" rx="28"/>
    <rect class="bar" y="45" width="230" height="33"/>
    <text x="22" y="38" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Example App</text>
    <text x="24" y="125" class="label">Username</text>
    <rect class="card" x="24" y="138" width="182" height="44" rx="8"/>
    <text x="38" y="166" class="body">demo-user</text>
    <text x="24" y="220" class="label">Password</text>
    <rect class="card" x="24" y="233" width="182" height="44" rx="8"/>
    <text x="38" y="261" class="body">••••••••••</text>
    <text x="190" y="261" class="small" text-anchor="end">show</text>
    <rect class="accent-light" x="24" y="304" width="182" height="44" rx="8"/>
    <text x="115" y="332" class="button-dark">Copy password</text>
    <text x="24" y="382" class="small">Clipboard clears after 30 seconds.</text>
    <line x1="24" y1="420" x2="206" y2="420" class="line"/>
    <rect class="accent" x="24" y="454" width="85" height="44" rx="8"/>
    <text x="66" y="482" class="button">Edit</text>
    <rect x="121" y="454" width="85" height="44" rx="8" fill="#fff" stroke="#c04a4a" stroke-width="2"/>
    <text x="164" y="482" fill="#c04a4a" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700">Delete</text>
    <text x="24" y="668" class="small">Secure screen enabled</text>
    <text x="115" y="754" class="small" text-anchor="middle">S-09 Credential detail</text>
  </g>

  <!-- Frame 6: Generator -->
  <g transform="translate(1290,105)">
    <rect class="phone" width="230" height="720" rx="28"/>
    <rect class="bar" width="230" height="78" rx="28"/>
    <rect class="bar" y="45" width="230" height="33"/>
    <text x="22" y="38" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Password generator</text>
    <text x="24" y="124" class="label">Generated password</text>
    <rect class="card" x="24" y="138" width="182" height="64" rx="8"/>
    <text x="38" y="176" class="body">R7!mK2@qP9#v</text>
    <text x="24" y="240" class="success" font-family="Arial" font-size="14" font-weight="700">Strong</text>
    <text x="24" y="268" class="label">Requirements</text>
    <text x="30" y="298" class="success" font-family="Arial" font-size="13">✓ 8+ characters</text>
    <text x="30" y="324" class="success" font-family="Arial" font-size="13">✓ Uppercase letter</text>
    <text x="30" y="350" class="success" font-family="Arial" font-size="13">✓ Lowercase letter</text>
    <text x="30" y="376" class="success" font-family="Arial" font-size="13">✓ Number</text>
    <text x="30" y="402" class="success" font-family="Arial" font-size="13">✓ Special character</text>
    <rect class="accent-light" x="24" y="444" width="182" height="44" rx="8"/>
    <text x="115" y="472" class="button-dark">Regenerate</text>
    <rect class="accent" x="24" y="510" width="182" height="46" rx="9"/>
    <text x="115" y="539" class="button">Use password</text>
    <text x="115" y="754" class="small" text-anchor="middle">S-11 Generator</text>
  </g>
</svg>
